services:
  backend:
    build: ./backend
    container_name: pr-reviewer-backend
    env_file: .env
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    container_name: pr-reviewer-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
